name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install
        run: pip install -e ".[dev]"
      - name: Tests (no API key; mock writer)
        run: pytest -q
      - name: Engine run (the README command)
        run: |
          growthengine run --input samples/I2_blog.md --week 2026-11-02
          growthengine audit --sample 20 --seed 1
