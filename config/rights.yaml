# Every file that goes into a rendered asset must be declared here (plan.md §3, "Rights-safe").
# Inputs can also be declared per run: growthengine run --input x.mp4 --rights "Own recording, own voice"
# `match` is a glob matched against the input path relative to the project root (forward slashes).

inputs:
  - match: "samples/*"
    owner: "Engine test samples (sample blog drafted with AI help, see AI_USE.md; test clip generated by ffmpeg)"
    licence: own work
  - match: "inputs/*"
    owner: "Raga Varshan (own writing, own recordings, own voice and face)"
    licence: own work

fonts:
  - match: "pillow:Aileron"
    licence: "CC0 1.0 (Aileron by Sora Sagano, bundled in Pillow); verify before publishing"
  - match: "templates/fonts/*"
    licence: "SIL Open Font License 1.1 (see the licence file next to each font)"

# No music is used. Add entries here (track, source, licence, proof) only if you add music.
music: []
