[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "growthengine"
version = "0.1.0"
description = "Turns one long input (blog, podcast, demo, webinar) into a week of platform-ready social posts"
requires-python = ">=3.10"
dependencies = [
  "anthropic>=2.3",
  "pydantic>=2.6",
  "pyyaml>=6",
  "rapidfuzz>=3.6",
  "pillow>=10.1",
  "openpyxl>=3.1",
  "tzdata",
]

[project.optional-dependencies]
# Local speech-to-text for audio/video inputs without a transcript file. Downloads a model on first use.
stt = ["faster-whisper>=1.2,<1.3", "av>=12,<18"]
dev = ["pytest>=8"]

[project.scripts]
growthengine = "growthengine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["video: needs ffmpeg and ffprobe on PATH"]
